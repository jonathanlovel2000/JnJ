  <title>Contoh 4 Navbar/Menu</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }


    .navbar {
      background-color: cyan;
      overflow: hidden;
    }


    .navbar a {
      float: left;
      display: block;
      color: black;
      text-align: center;
      padding: 14px 20px;
      text-decoration: none;
      transition: background 0.3s;
    }


    .navbar a:hover {
      background-color: rgb(205, 255, 255);
    }


    @media screen and (max-width: 600px) {
      .navbar a {
        float: none;
        width: 100%;
      }
    }
  </style>
</head>
